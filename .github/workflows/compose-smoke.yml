name: Compose smoke tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MINIFI_PROBE_AGENT_ID: oem-smoke-agent-01
      MINIFI_FLOW_AGENT_ID: oem-smoke-agent-01
      OEM_API_PORT: "0"
      OEM_UI_PORT: "0"
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate Compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile agent config --quiet
          docker compose --profile smoke config --quiet
          docker compose --profile agent --profile fleet config --quiet
      - run: docker compose --profile smoke up --build --exit-code-from smoke
      - if: always()
        run: docker compose --profile smoke down
