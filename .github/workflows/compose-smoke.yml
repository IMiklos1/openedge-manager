name: Compose smoke tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MINIFI_PROBE_AGENT_ID: oem-smoke-agent-01
      MINIFI_FLOW_AGENT_ID: oem-smoke-agent-01
      MINIFI_FLOW_AGENT_IDS: oem-test-agent-cpp
      OEM_CPP_C2_ORIGIN: http://c2-observer:8001
      OEM_API_PORT: "0"
      OEM_UI_PORT: "0"
      OEM_NIFI_PORT: "0"
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate Compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile agent config --quiet
          agent_services=$(docker compose --profile agent config --services)
          grep -Fx minifi-agent-01 <<< "$agent_services"
          grep -Fx minifi-cpp <<< "$agent_services"
          docker compose --profile smoke config --quiet
          docker compose --profile agent --profile fleet config --quiet
          docker compose -f docker-compose.yml -f compose.minifi-cpp.yaml --profile agent --profile cpp config --quiet
          docker compose -f docker-compose.yml -f compose.minifi-cpp.yaml --profile smoke config --quiet
          docker compose -f docker-compose.yml -f compose.minifi-cpp.yaml -f compose.nifi.yaml --profile smoke config --quiet
      - run: docker compose -f docker-compose.yml -f compose.minifi-cpp.yaml -f compose.nifi.yaml --profile smoke up --build --exit-code-from smoke
      - name: Verify opted-in Python processing on the C++ agent
        env:
          MINIFI_ALLOW_EXECUTION_PROCESSORS: "true"
        run: |
          docker compose -f docker-compose.yml -f compose.minifi-cpp.yaml -f compose.nifi.yaml --profile smoke up -d --wait api ui minifi-cpp minifi-smoke-agent
          docker compose -f docker-compose.yml -f compose.minifi-cpp.yaml -f compose.nifi.yaml --profile smoke run --rm --no-deps -e PYTHONPATH=/app:/app/tests smoke python -m unittest -v test_cpp.CppDeploymentTest.test_native_python_execution_requires_opt_in
      - if: always()
        run: docker compose -f docker-compose.yml -f compose.minifi-cpp.yaml -f compose.nifi.yaml --profile smoke down
