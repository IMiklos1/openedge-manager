services:
  minifi-agent-01:
    image: apache/nifi-minifi:${MINIFI_VERSION:?Set MINIFI_VERSION}
    restart: unless-stopped

    depends_on:
      - api

    networks:
      - default

    volumes:
      - ./minifi/agent-01/conf:/opt/minifi/conf
      - ./minifi/agent-01/input:/test/input
      - ./minifi/agent-01/output:/test/output

    environment:
      TZ: Europe/Budapest