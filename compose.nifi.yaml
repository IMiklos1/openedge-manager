services:
  nifi:
    image: apache/nifi:2.12.0@sha256:6f7f2840dbf178c6dd3fa13435b9b358f3be3c6fb7417de467a35a267f4d28ad
    hostname: nifi
    init: true
    entrypoint: ["sh", "/oem/start.sh"]
    environment:
      NO_PROXY: nifi,localhost,127.0.0.1,c2-observer
      no_proxy: nifi,localhost,127.0.0.1,c2-observer
    ports: ["127.0.0.1:${OEM_NIFI_PORT:-8080}:8080"]
    volumes:
      - ./nifi:/oem:ro
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/nifi-api/site-to-site"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
    stop_grace_period: 45s
    restart: unless-stopped

  api:
    environment:
      OEM_NIFI_URL: http://nifi:8080

  smoke:
    environment:
      OEM_SMOKE_NIFI: "true"
    depends_on:
      nifi: {condition: service_healthy}

volumes:
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
