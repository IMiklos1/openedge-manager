x-local-http: &local-http
  NO_PROXY: 127.0.0.1,localhost,api,ui,storage
  no_proxy: 127.0.0.1,localhost,api,ui,storage

services:
  postgres:
    image: postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment: &postgres-env
      POSTGRES_DB: ${POSTGRES_DB:-oem}
      POSTGRES_USER: ${POSTGRES_USER:-oem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: ["mini", "-dir=/data", "-webdav=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment: &s3-env
      <<: *local-http
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-oem-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change-me-storage-local-only}
      S3_BUCKET: ${S3_BUCKET:-oem-artifacts}
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      <<: [*postgres-env, *local-http]
      POSTGRES_HOST: postgres
      MINIFI_PROBE_AGENT_ID: ${MINIFI_PROBE_AGENT_ID:-}
    ports: ["127.0.0.1:${OEM_API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  ui:
    build: ./frontend
    environment:
      <<: *local-http
      API_PROXY_TARGET: http://api:8000
    ports: ["127.0.0.1:${OEM_UI_PORT:-5173}:5173"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minifi-agent-01:
    extends:
      file: compose.minifi.yaml
      service: minifi-agent-01
    environment: *local-http

  smoke:
    profiles: [smoke]
    build:
      context: ./backend
      target: smoke
    environment:
      <<: [*postgres-env, *s3-env]
      POSTGRES_HOST: postgres
    depends_on:
      api: {condition: service_healthy}
      ui: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_healthy}
      minifi-agent-01: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  s3data:
